<header class="header">
    <div class="header-content">
        <div class="brand">
            <a [routerLink]="['/home']">
                MyApp
            </a>
        </div>
        <div class="user-info">
            <a [routerLink]="['/home']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <div class="user-avatar"> {{ this.userServiceService.myUser.name?.charAt(0)?.toUpperCase() }} </div>
                <span class="user-name"> {{ this.userServiceService.myUser.name }}
                </span>
            </a>
            <a [routerLink]="['/products']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                <span>Products</span>
            </a>
        </div>
    </div>

    <div class="log-out">
        <span class="logo-name" (click)="AdminLogout()"> Log Out
        </span>
    </div>
</header>
