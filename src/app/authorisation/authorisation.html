<div class="sign-in">
    <form [formGroup]="signInForm" (ngSubmit)="SignIn()">
        <h1>ავტორიზაცია</h1>
        <p-toast />
        <div>
            <div class="input-box">
                <label for="email-sign-in">მეილი:</label>
                <input id="email-sign-in" formControlName="email" type="email" />
            </div>
            <div *ngIf="
            signInForm.get('email').invalid && signInForm.get('email').touched
          ">
                <small *ngIf="signInForm.get('email').hasError('required')">შეავსეთ მეილი</small>
                <small *ngIf="signInForm.get('email').hasError('email')">შეიყვანეთ ვალიდური მეილი</small>
            </div>

            <div>
                <div class="input-box">
                    <label for="password-sign-in">პაროლი:</label>
                    <input id="password-sign-in" formControlName="password" type="password" />
                </div>
                <div *ngIf="
            signInForm.get('password').invalid &&
            signInForm.get('password').touched
          ">
                    <small *ngIf="signInForm.get('password').hasError('required')">შეიყვანეთ პაროლი</small>
                    <small *ngIf="signInForm.get('password').hasError('pattern')">პაროლი უნდა იყოს მინიმუმ 8 ასოსგან
                        შემდგარი,უნდა შეიცავდეს დიდ და
                        პატარა ასოს და სიმბოლოს</small>
                </div>
            </div>
            <a routerLink="/email-verify">რეგისტრაცია</a>
            <div class="card flex justify-content-center" *ngIf="isSpin">
                <p-progress-spinner styleClass="w-4rem h-4rem" strokeWidth="8" fill="var(--surface-ground)"
                    animationDuration=".5s" style="width: 100%; height: 45px" ;>
                </p-progress-spinner>
            </div>
        </div>
        <div class="sign-in-btn"><button type="submit">შესვლა</button></div>

    </form>
</div>
